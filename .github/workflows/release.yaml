name: Release

on:
  release:
    types: [released]

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  generate_zip:
    name: Generate release zip
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Check manifest.json version
        run: |
          manifest_version=$(jq -r '.version' custom_components/twincat_iot_communicator/manifest.json)
          release_tag="${GITHUB_REF#refs/tags/}"
          release_version="${release_tag#v}"

          echo "Manifest version: $manifest_version"
          echo "Release tag: $release_tag (version: $release_version)"

          if [ "$release_version" != "$manifest_version" ]; then
            echo "::error::Release tag ($release_tag) does not match manifest.json version ($manifest_version)"
            exit 1
          fi

      - name: Zip release file
        run: |
          cd custom_components/twincat_iot_communicator
          zip -r ../../twincat_iot_communicator.zip ./*

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: twincat_iot_communicator.zip
          fail_on_unmatched_files: true
