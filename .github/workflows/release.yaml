name: Release

# Releases a version straight from the repository:
#
# 1. A push to main (or "Run workflow") reads the version from manifest.json.
# 2. If the release v<version> already exists, nothing happens.
# 3. Otherwise the release must be ready: release-notes/v<version>.md exists,
#    README badge and changelog name the same version (script/release.py check).
#    A missing file or a version mismatch fails the run with a clear error.
# 4. ruff, pytest, hassfest and the HACS validation run on that commit.
# 5. Only when all pass, the zip is built and the tag plus a "Latest" release
#    with the release notes as text and the zip attached are created.
#
# A release published by hand still gets its zip (event "release").

on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [released]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Check version
    # Releases are only made from main, also when started by hand.
    if: github.event_name != 'release' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      release: ${{ steps.exists.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Read manifest version
        id: version
        run: |
          version=$(python script/release.py version)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Manifest version: $version"
      - name: Look for an existing release
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "release=exists" >> "$GITHUB_OUTPUT"
            echo "::notice::Release $TAG already exists, nothing to do."
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "::error::Tag $TAG exists without a release. Delete the tag or publish its release by hand."
            exit 1
          fi
          echo "release=new" >> "$GITHUB_OUTPUT"
      - name: Check the release is ready
        if: steps.exists.outputs.release == 'new'
        run: python script/release.py check

  pytest:
    name: pytest
    needs: prepare
    if: needs.prepare.outputs.release == 'new'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt
      - name: Run tests
        run: pytest -q --timeout=120

  ruff:
    name: ruff
    needs: prepare
    if: needs.prepare.outputs.release == 'new'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff==0.17.4
      - run: ruff check custom_components tests script

  hassfest:
    name: hassfest
    needs: prepare
    if: needs.prepare.outputs.release == 'new'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    needs: prepare
    if: needs.prepare.outputs.release == 'new'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  release:
    name: Create release
    needs: [prepare, pytest, ruff, hassfest, hacs]
    if: needs.prepare.outputs.release == 'new'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check the release is ready
        run: python script/release.py check
      - name: Build zip
        run: python script/release.py zip twincat_iot_communicator.zip
      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::notice::Release $TAG was created in the meantime, nothing to do."
            exit 0
          fi
          gh release create "$TAG" twincat_iot_communicator.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file "$(python script/release.py notes)" \
            --latest

  attach_zip:
    name: Attach zip to a release published by hand
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check manifest version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          manifest_version=$(python script/release.py version)
          echo "Manifest version: $manifest_version, release tag: $TAG"
          if [ "${TAG#v}" != "$manifest_version" ]; then
            echo "::error::Release tag ($TAG) does not match manifest.json version ($manifest_version)"
            exit 1
          fi
      - name: Build zip
        run: python script/release.py zip twincat_iot_communicator.zip
      - name: Upload zip
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" twincat_iot_communicator.zip --repo "$GITHUB_REPOSITORY" --clobber
